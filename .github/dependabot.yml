version: 2
updates:
  # npm dependencies
  - package-ecosystem: npm
    directory: /
    target-branch: master
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Batch low-risk bumps into a single PR; major bumps stay separate for review.
      npm-minor-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions used by the CI workflow
  - package-ecosystem: github-actions
    directory: /
    target-branch: master
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
